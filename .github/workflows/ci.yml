name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `prepare` runs `vite build`, so this also proves the package builds.
      - run: npm ci

      - run: npm test

      - run: npm run build
